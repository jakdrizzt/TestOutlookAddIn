<!-- Test-Plugin file version: 0.2-auth-dialog.html-1 -->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Accesso al servizio</title>
  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>
  <script
    src="auth-dialog.bundle.js"
    defer>
  </script>
  <style>
    body { margin: 0; padding: 24px; background: #ffffff; color: #323130; font-family: "Segoe UI", Arial, sans-serif; }
    .auth-card { max-width: 520px; margin: 0 auto; padding: 20px; border: 1px solid #edebe9; border-radius: 8px; background: #faf9f8; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 0; color: #605e5c; line-height: 1.5; }
    .spinner { width: 24px; height: 24px; margin-top: 20px; border: 3px solid #c7e0f4; border-top-color: #0078d4; border-radius: 50%; animation: rotate 0.8s linear infinite; }
      .auth-button { width: 100%; margin-top: 18px; padding: 10px 14px; border: 0; border-radius: 6px; background: #0078d4; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; }
      .auth-button:hover { background: #106ebe; }
      .auth-button:disabled { background: #a19f9d; cursor: wait; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .diagnostics { display: none; margin-top: 20px; padding-top: 16px; border-top: 1px solid #edebe9; }
    .diagnostics-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .diagnostics h2 { margin: 0; font-size: 14px; }
    .diagnostics button { padding: 5px 9px; border: 1px solid #8a8886; border-radius: 4px; background: #ffffff; color: #323130; cursor: pointer; }
    #auth-diagnostics { max-height: 240px; margin: 0; padding: 10px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 4px; background: #f3f2f1; color: #323130; font-family: Consolas, monospace; font-size: 11px; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1 id="auth-title">Accesso al servizio</h1>
    <p id="auth-message">
      Seleziona l'account SOGEI e completa
      l'eventuale verifica MFA.
    </p>
      <button id="start-popup-auth" class="auth-button" type="button" hidden>Accedi a SOGEI</button>
      <button id="cancel-popup-auth" class="auth-cancel-button" type="button" hidden>Annulla accesso</button>
      <div id="auth-spinner" class="spinner" aria-label="Autenticazione in corso"></div>
    <section
      class="diagnostics"
      aria-label="Diagnostica autenticazione">
      <div class="diagnostics-header">
        <h2>Diagnostica autenticazione</h2>
        <button
          id="clear-auth-diagnostics"
          type="button">
          Pulisci
        </button>
      </div>
      <pre id="auth-diagnostics">Caricamento diagnostica...</pre>
    </section>
  </main>
</body>
</html>
